apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: pulseguard
  labels:
    app: notification-service
    app.kubernetes.io/part-of: pulseguard
spec:
  # ---------------------------------------------------------------------
  # replicas: 1 — live since Task 17
  # ---------------------------------------------------------------------
  # This ran at zero through Task 16 because neither of its dependencies
  # existed in AWS. Both now do:
  #
  #   * Kafka  — Amazon MSK, private, TLS on 9094
  #   * SMTP   — Gmail, reached outbound through the NAT Gateway
  #
  # Deliberately one replica. A second would consume from the same group and
  # simply split partitions; there is no throughput problem to solve, and one
  # consumer keeps the demonstration's ordering easy to reason about.
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      securityContext:
        # Numeric UID is required: the image ends with `USER pulseguard`, and
        # the kubelet cannot verify a *name* is non-root, so runAsNonRoot alone
        # fails with CreateContainerConfigError.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: 423151037862.dkr.ecr.us-east-1.amazonaws.com/pulseguard-notification-service:4970e68
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: pulseguard-config
            - secretRef:
                name: pulseguard-secrets
            # Gmail App Password lives in its own Secret so that rotating it
            # never risks disturbing the database and JWT credentials.
            # Created at deploy time; never committed.
            - secretRef:
                name: pulseguard-smtp-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
