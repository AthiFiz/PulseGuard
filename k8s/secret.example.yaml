# TEMPLATE ONLY — every value here is a placeholder.
#
# The real Secret is never committed. It is created at deploy time from values
# pulled out of AWS Secrets Manager, so the RDS password exists only in AWS and
# in the cluster, never in this repository and never in a shell history file:
#
#   SECRET_ARN=$(aws rds describe-db-instances \
#       --db-instance-identifier pulseguard-mysql \
#       --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text)
#
#   DB_USER=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
#       --query SecretString --output text | python3 -c \
#       'import sys,json;print(json.load(sys.stdin)["username"])')
#   DB_PASS=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
#       --query SecretString --output text | python3 -c \
#       'import sys,json;print(json.load(sys.stdin)["password"])')
#
#   kubectl create secret generic pulseguard-secrets -n pulseguard \
#       --from-literal=DB_USERNAME="$DB_USER" \
#       --from-literal=DB_PASSWORD="$DB_PASS" \
#       --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
#
# A cluster-native alternative (External Secrets Operator, or the Secrets Store
# CSI driver) would remove the laptop from that path entirely. It is
# deliberately out of scope for this short-lived environment.
apiVersion: v1
kind: Secret
metadata:
  name: pulseguard-secrets
  namespace: pulseguard
type: Opaque
stringData:
  DB_USERNAME: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  # 32+ random bytes, base64. Never reuse the development value from
  # compose.yaml — that one is published in this repository.
  JWT_SECRET: "REPLACE_ME"
