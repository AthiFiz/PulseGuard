# The PulseGuard Overview dashboard, provisioned rather than hand-built.
#
# kube-prometheus-stack runs a sidecar beside Grafana that watches for
# ConfigMaps labelled `grafana_dashboard: "1"` and loads whatever JSON they
# contain. That means this dashboard is created from source control on install,
# survives Grafana being deleted and recreated, and is reviewable in a diff —
# none of which is true of a dashboard built by clicking in the UI.
#
# Generated by scripts/gen_dashboard.py. Edit that and regenerate rather than
# hand-editing the JSON below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulseguard-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: pulseguard
data:
  pulseguard-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "title": "PulseGuard Overview",
      "uid": "pulseguard-overview",
      "tags": [
        "pulseguard"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "label": "Datasource",
            "hide": 0,
            "current": {},
            "refresh": 1,
            "regex": ""
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Application health",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Control API",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "up{job=\"control-api\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 1
                    },
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Monitor Worker",
