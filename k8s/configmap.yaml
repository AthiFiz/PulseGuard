# Non-secret runtime configuration.
#
# Nothing in here is sensitive: the RDS hostname is not a credential, and the
# database is unreachable without one. Credentials live in the Secret
# `pulseguard-secrets`, which is created at deploy time and never committed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulseguard-config
  namespace: pulseguard
data:
  # connectionTimeZone/preserveInstants keep Instant values round-tripping as
  # true UTC regardless of the RDS server's or the JVM's local zone. These are
  # the same parameters Docker Compose uses; only the host differs.
  DB_URL: "jdbc:mysql://pulseguard-mysql.cc5sk4k4err6.us-east-1.rds.amazonaws.com:3306/pulseguard?connectionTimeZone=UTC&preserveInstants=true"

  # The browser reaches the API through the frontend's nginx on the same
  # origin, so no cross-origin request is ever made and this value is not
  # load-bearing in this deployment. It is set to the ALB rather than left
  # blank so that a direct API call from the same host is not rejected.
  FRONTEND_ORIGIN: "http://k8s-pulsegua-frontend-3f2f4688ff-1943409317.us-east-1.elb.amazonaws.com"

  # Incident emails contain a link back to the incident. It has to be an
  # address the reader's browser can actually resolve, so it is the ALB —
  # "http://frontend" would only work inside the cluster, which is the one
  # place the recipient is not.
  FRONTEND_BASE_URL: "http://k8s-pulsegua-frontend-3f2f4688ff-1943409317.us-east-1.elb.amazonaws.com"

  # ---------------------------------------------------------------------
  # Kafka — Amazon MSK, private, TLS
  # ---------------------------------------------------------------------
  # Broker DNS names are deployment configuration, not application code and
  # not a credential: the brokers sit in private subnets and their security
  # group admits only the EKS nodes, so knowing the name grants nothing.
  KAFKA_BOOTSTRAP_SERVERS: "b-1.pulseguardmsk.ipl9au.c1.kafka.us-east-1.amazonaws.com:9094,b-2.pulseguardmsk.ipl9au.c1.kafka.us-east-1.amazonaws.com:9094"

  # MSK accepts only TLS on 9094; there is no plaintext listener. Spring Kafka
  # reads this as a plain client property and the JVM's default CA trust store
  # validates Amazon's broker certificates, so no custom truststore is needed.
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: "SSL"

  # Two brokers, so the topic can afford two replicas. Local Docker runs a
  # single broker and keeps the default of 1 — this value is why that still
  # works without any code change.
  KAFKA_INCIDENT_TOPIC_REPLICATION: "2"

  # ---------------------------------------------------------------------
  # Outbound email — Gmail SMTP through the NAT Gateway
  # ---------------------------------------------------------------------
  # Non-secret settings only. The Gmail App Password lives in the separate
  # Secret `pulseguard-smtp-secrets`, alongside the username it authenticates.
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS_ENABLE: "true"
  MAIL_FROM: "athif.rasheedh@gmail.com"

  # ---------------------------------------------------------------------
  # SSRF policy — the single most important difference from local Docker
  # ---------------------------------------------------------------------
  # Compose sets this to `true` because every address inside a Compose network
  # is private, so a monitoring demo would otherwise have nothing it is allowed
  # to check. That reasoning does not survive contact with a real VPC: here,
  # private addresses are the RDS instance, the Kubernetes API, the other pods
  # and the rest of 10.0.0.0/16. A monitor URL pointing at any of them must be
  # refused.
  #
  # Cloud metadata endpoints are blocked unconditionally in DestinationPolicy
  # and do not depend on this setting.
  MONITOR_ALLOW_PRIVATE_ADDRESSES: "false"
