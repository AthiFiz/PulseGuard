
spring:
  application:
    name: pulseguard-control-api

  datasource:
    # connectionTimeZone/preserveInstants keep Instant values round-tripping as
    # true UTC regardless of the server's or the JVM's local zone.
    url: "${DB_URL:jdbc:mysql://localhost:3306/pulseguard?connectionTimeZone=UTC&preserveInstants=true}"
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:Ayana2019@}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Flyway owns the schema. Hibernate only checks that the mappings agree
    # with it, and startup fails loudly if they have drifted apart.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # health + prometheus, and nothing else. Deliberately not "*": that
        # would also publish /actuator/env, /configprops, /beans and
        # /heapdump, which leak configuration and can dump the whole JVM
        # heap — including secrets held in memory.
        include: health,prometheus
  metrics:
    tags:
      # Every metric from this process carries application=<name>, so a
      # single Prometheus query can separate the three backends without
      # relying on pod names that change on every rollout.
      application: pulseguard-control-api

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

  jwt:
    # Local development secret, committed deliberately so the application runs
    # with no environment setup. Override with JWT_SECRET anywhere real, and
    # generate a fresh one with: openssl rand -base64 32
    secret: ${JWT_SECRET:KI48kUwS4YmFemZujyzzCwZw0xFfZpIaaVwY86jvaYc=}
    expiration: ${JWT_EXPIRATION:PT1H}
    issuer: ${JWT_ISSUER:pulseguard-control-api}
