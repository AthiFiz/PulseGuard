# PulseGuard frontend — static SPA plus a same-origin path to the Control API.
#
# This file exists only in the Docker image. Running `npm run dev` still talks
# to the Control API directly on http://localhost:8080 via VITE_API_BASE_URL,
# and that workflow is untouched.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No need to advertise the exact nginx build in every response header.
    server_tokens off;

    # Docker's embedded DNS. nginx resolves a literal upstream name once, when
    # it loads this configuration, and then caches that address for the life of
    # the process. If the Control API container is ever replaced on a different
    # IP — which Docker is free to do, and does whenever the address has been
    # taken in the meantime — a cached address would leave this proxy talking
    # to somewhere nothing answers, and no amount of restarting the backend
    # would fix it. Re-resolving on a short TTL removes that failure mode.
    #
    # This is insurance rather than something observed breaking: in local
    # testing the recreated container happened to be given the same address
    # back each time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------------
    # API — reverse proxied, so the browser only ever sees one origin
    # ---------------------------------------------------------------------
    #
    # The alternative is for the browser to call the Control API directly,
    # which would mean either baking a Docker-internal hostname into the
    # JavaScript bundle — a name that only resolves inside the Compose network
    # and never in the user's browser — or opening CORS wider than it should
    # be. Proxying avoids both: requests go to /api/... on this same server.
    location /api/ {
        # The upstream is held in a variable on purpose. A literal
        # `proxy_pass http://control-api:8080` is resolved at configuration
        # load; going through a variable forces the resolver above to be used
        # on each request instead. Because the value carries no path, the
        # original request URI has to be appended explicitly.
        set $control_api http://control-api:8080;
        proxy_pass $control_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A backend that is slow should surface as a failed request rather than
        # a browser tab that hangs indefinitely.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---------------------------------------------------------------------
    # Static assets
    # ---------------------------------------------------------------------
    #
    # Vite fingerprints these filenames with a content hash, so a given URL can
    # never change meaning and may be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html deliberately gets no expires directive. It is the file that
    # names the current hashed bundles, so a cached copy would pin the browser
    # to a previous build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------
    # SPA fallback
    # ---------------------------------------------------------------------
    #
    # React Router owns the URL space. /monitors/14 and /incidents/5 are real
    # application routes but not real files, so a browser refresh or a pasted
    # link on one of them must be answered with the application itself rather
    # than nginx's 404 page. The router then reads the path and renders.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
